[package]
name = "aboom-toolbox-desktop"
version = "0.1.0"
description = "Local audio workshop for Aboom Toolbox"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = [ "derive" ] }
tauri = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
